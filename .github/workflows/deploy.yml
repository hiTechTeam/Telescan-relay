name: Validate and deploy EU relay

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: telescan-relay-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test release transaction
        run: bash ops/test-release-transaction.sh

      - name: Validate configuration
        run: bash ops/preflight.sh

  deploy:
    name: Deploy to EU production
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.DEPLOY_ENABLED == 'true'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.RELAY_SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.RELAY_SERVER_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload, deploy, and verify under the production lock
        env:
          RELAY_SERVER_HOST: ${{ secrets.RELAY_SERVER_HOST }}
          RELAY_SERVER_USER: ${{ secrets.RELAY_SERVER_USER }}
        run: |
          set -Eeuo pipefail
          tar \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='.DS_Store' \
            --exclude='._*' \
            --exclude='data' \
            --create --gzip --file=- . | \
            ssh \
              -o BatchMode=yes \
              -o IdentitiesOnly=yes \
              -i ~/.ssh/id_ed25519 \
              "$RELAY_SERVER_USER@$RELAY_SERVER_HOST" '
                set -Eeuo pipefail
                command -v flock >/dev/null
                exec 9>/tmp/telescan-production-deploy.lock
                flock --exclusive --timeout 1800 9
                release_root="$(mktemp -d /tmp/telescan-relay-release.XXXXXX)"
                trap '\''rm -r -- "$release_root"'\'' EXIT
                tar --extract --gzip --file=- --directory "$release_root"
                chmod +x "$release_root"/ops/*.sh

                cmp --silent \
                  "$release_root/ops/systemd/telescan-relay-certbot-renew.service" \
                  /etc/systemd/system/telescan-relay-certbot-renew.service
                cmp --silent \
                  "$release_root/ops/systemd/telescan-relay-certbot-renew.timer" \
                  /etc/systemd/system/telescan-relay-certbot-renew.timer
                cmp --silent \
                  "$release_root/ops/systemd/telescan-relay-release-recovery.service" \
                  /etc/systemd/system/telescan-relay-release-recovery.service
                cmp --silent \
                  "$release_root/ops/systemd/telescan-relay-release-recovery.path" \
                  /etc/systemd/system/telescan-relay-release-recovery.path
                cmp --silent \
                  "$release_root/ops/ssh/00-telescan-hardening.conf" \
                  /etc/ssh/sshd_config.d/00-telescan-hardening.conf
                test "$(stat -c '%U:%G:%a' \
                  /etc/ssh/sshd_config.d/00-telescan-hardening.conf)" = \
                  root:root:644
                systemctl is-enabled --quiet telescan-relay-certbot-renew.timer
                systemctl is-active --quiet telescan-relay-certbot-renew.timer
                systemctl is-enabled --quiet telescan-relay-release-recovery.service
                systemctl is-enabled --quiet telescan-relay-release-recovery.path
                systemctl is-active --quiet telescan-relay-release-recovery.path

                "$release_root/ops/run-release-transaction.sh" \
                  --apply --confirm DEPLOY_RELAY_WITH_ROLLBACK \
                  --active-root /opt/telescan-relay \
                  --release-root "$release_root"
                systemctl is-enabled --quiet telescan-relay-certbot-renew.timer
                systemctl is-active --quiet telescan-relay-certbot-renew.timer
              '
