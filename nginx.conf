worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format relay '$remote_addr - $host [$time_local] "$request" '
                     '$status $body_bytes_sent "$http_user_agent" '
                     'upstream=$upstream_addr upstream_time=$upstream_response_time';
    access_log /dev/stdout relay;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    upstream moscow_origin {
        server 10.77.0.1:8081 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name api.tgtelescan.ru;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location /health/relay {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location ^~ /internal/ {
            return 404;
        }

        location ~ ^/(docs/?|redoc|openapi\.json)$ {
            return 404;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name api.tgtelescan.ru;

        ssl_certificate /etc/letsencrypt/live/api.tgtelescan.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.tgtelescan.ru/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;

        client_max_body_size 20M;

        location /health/relay {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location ^~ /internal/ {
            return 404;
        }

        location ~ ^/(docs/?|redoc|openapi\.json)$ {
            return 404;
        }

        location / {
            proxy_pass http://moscow_origin;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Telescan-Relay eu-nl-1;
            proxy_hide_header X-Powered-By;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_next_upstream off;
        }
    }
}
