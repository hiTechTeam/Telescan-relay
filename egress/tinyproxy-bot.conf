User tinyproxy
Group tinyproxy

Port 8889
Listen 10.77.0.2
Timeout 30

Syslog On
LogLevel Notice
PidFile "/run/tinyproxy/telescan-bot.pid"

MaxClients 32

Allow 10.77.0.1

ConnectPort 443

Filter "/etc/tinyproxy/telescan-bot-telegram-filter"
FilterType ere
FilterCaseSensitive No
FilterDefaultDeny Yes

ViaProxyName "telescan-bot-egress"
DisableViaHeader Yes
